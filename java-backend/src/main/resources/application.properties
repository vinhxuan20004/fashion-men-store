# Server configuration
server.port=8080

# MongoDB Configuration
spring.data.mongodb.uri=mongodb://localhost:27017/mens-fashion-store
spring.data.mongodb.database=mens-fashion-store

# JWT Configuration
jwt.secret=your_very_long_secret_key_used_for_jwt_signing_at_least_32_characters_long
jwt.expiration=86400000

# Cloudinary Configuration
cloudinary.cloud_name=your_cloud_name
cloudinary.api_key=your_api_key
cloudinary.api_secret=your_api_secret

# VNPay Configuration
vnpay.tmn_code=your_tmn_code
vnpay.hash_secret=your_hash_secret
vnpay.vnp_url=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
vnpay.return_url=http://localhost:8080/api/payment/vnpay-callback

# MoMo Configuration
momo.partner_code=your_partner_code
momo.access_key=your_access_key
momo.secret_key=your_secret_key
momo.endpoint=https://test-payment.momo.vn/v2/gateway/api/create
momo.notify_url=http://localhost:3000/api/payment/momo-callback

# OpenAPI Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# File upload configuration
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# Enable method security (@PreAuthorize)
spring.main.allow-bean-definition-overriding=true
